name: Deploy Pages

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      artifact_checksum: ${{ steps.build.outputs.artifact_checksum }}
      artifact_id: ${{ steps.build.outputs.artifact_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_branch: ${{ steps.source.outputs.source_branch }}
    environment:
      name: github-pages
    steps:
      - name: Resolve source commit + branch
        id: source
        run: |
          echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Wait for matching prod CI success
        if: ${{ github.event_name == 'push' && github.ref_name == 'prod' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/watch-ci-run.js --branch prod --sha ${{ steps.source.outputs.source_sha }} --workflow "CI" --timeout 3600 --interval 15

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Build deploy artifact from current prod commit
        id: build
        run: node scripts/build/create-artifact.js --out /tmp/rb-site-artifact

      - name: Verify artifact integrity before deployment
        run: node scripts/qa/verify-artifact-integrity.js --artifact /tmp/rb-site-artifact --expect-commit ${{ steps.source.outputs.source_sha }}

      - name: Ensure production CNAME exists
        run: test -f /tmp/rb-site-artifact/site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/rb-site-artifact/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-validation:
    runs-on: ubuntu-latest
    needs: deploy-pages
    if: ${{ needs.deploy-pages.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Pages propagation window
        run: sleep 30

      - name: Validate live production deployment
        env:
          RB_LIVE_MAX_ATTEMPTS: '8'
          RB_LIVE_RETRY_DELAY_MS: '15000'
        run: node scripts/qa/verify-live-production.js

      - name: Print production deployment summary
        run: |
          echo "Production deployment validated"
          echo "URL: https://romanbediner.com"
          echo "Branch: ${{ needs.deploy-pages.outputs.source_branch }}"
          echo "Commit: ${{ needs.deploy-pages.outputs.source_sha }}"
          echo "Node: $(node -v)"
          echo "Artifact ID: ${{ needs.deploy-pages.outputs.artifact_id }}"
          echo "Artifact checksum: ${{ needs.deploy-pages.outputs.artifact_checksum }}"

  release-tag:
    runs-on: ubuntu-latest
    needs:
      - deploy-pages
      - post-deploy-validation
    if: ${{ needs.deploy-pages.result == 'success' && needs.deploy-pages.outputs.source_branch == 'prod' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create deterministic release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG="v$(date -u +'%Y.%m.%d')"
          TAG="$BASE_TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="${BASE_TAG}.${{ github.run_number }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "${{ needs.deploy-pages.outputs.source_sha }}"
          git push origin "$TAG"
          echo "Created release tag: $TAG"
