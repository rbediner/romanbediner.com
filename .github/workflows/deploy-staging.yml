name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - staging
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional commit SHA to preview (defaults to current branch head)
        required: false
      source_branch:
        description: Branch to preview (defaults to staging)
        required: false

permissions:
  contents: read

concurrency:
  group: staging-preview-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging') }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_REPO: ${{ vars.PREVIEW_REPO || 'rbediner/romanbediner-preview' }}
      PREVIEW_BRANCH: staging-preview
    steps:
      - name: Resolve source commit + branch
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "source_branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            SOURCE_SHA="${{ github.event.inputs.source_sha }}"
            SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
            if [ -z "$SOURCE_SHA" ]; then
              SOURCE_SHA="${{ github.sha }}"
            fi
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH="staging"
            fi
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Build staging preview artifact
        id: build
        run: PREVIEW_BASE_PATH="/${PREVIEW_REPO#*/}" node scripts/build/create-preview-artifact.js --out /tmp/rb-staging-preview-artifact

      - name: Verify staging preview artifact
        run: node scripts/qa/verify-preview-artifact.js --artifact /tmp/rb-staging-preview-artifact --expect-commit ${{ steps.source.outputs.source_sha }}

      - name: Upload preview artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: staging-preview-artifact-${{ steps.source.outputs.source_sha }}
          path: /tmp/rb-staging-preview-artifact
          if-no-files-found: error

      - name: Publish isolated preview repository
        id: publish
        continue-on-error: true
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          node scripts/release/publish-preview-repo.js \
            --artifact /tmp/rb-staging-preview-artifact \
            --repo "$PREVIEW_REPO" \
            --branch "$PREVIEW_BRANCH" \
            --source-sha "${{ steps.source.outputs.source_sha }}" \
            --source-branch "${{ steps.source.outputs.source_branch }}"

      - name: Fail with explicit preview publication summary
        if: ${{ steps.publish.conclusion != 'success' }}
        run: |
          {
            echo "## Staging Preview Failed"
            echo
            echo "Preview publication failed. Check the publish step logs for details."
            echo
            echo "Branch: ${{ steps.source.outputs.source_branch }}"
            echo "Commit: ${{ steps.source.outputs.source_sha }}"
            echo "Node: $(node -v)"
            echo "Target preview repo: $PREVIEW_REPO"
            echo "Target preview branch: $PREVIEW_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "FAIL: Staging preview publication failed." >&2
          exit 1

      - name: Print staging deployment summary
        if: ${{ steps.publish.conclusion == 'success' }}
        run: |
          echo "Staging Deployment Summary"
          echo "Branch: ${{ steps.source.outputs.source_branch }}"
          echo "Commit: ${{ steps.source.outputs.source_sha }}"
          echo "Node: $(node -v)"
          echo "Preview URL: ${{ steps.publish.outputs.preview_url }}"
          echo "Artifact ID: ${{ steps.build.outputs.preview_artifact_id }}"
          echo "Artifact checksum: ${{ steps.build.outputs.preview_checksum }}"

      - name: Validate live staging preview deployment
        if: ${{ steps.publish.conclusion == 'success' }}
        env:
          RB_PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        run: node scripts/qa/verify-live-preview.js

      - name: Write staging deployment summary to job summary
        if: ${{ steps.publish.conclusion == 'success' }}
        run: |
          {
            echo "## Staging Preview Ready"
            echo
            echo "Preview your changes here:"
            echo
            echo "${{ steps.publish.outputs.preview_url }}"
            echo
            echo "Branch: ${{ steps.source.outputs.source_branch }}"
            echo "Commit: ${{ steps.source.outputs.source_sha }}"
            echo "Node: $(node -v)"
            echo "Artifact ID: ${{ steps.build.outputs.preview_artifact_id }}"
            echo "Artifact checksum: ${{ steps.build.outputs.preview_checksum }}"
          } >> "$GITHUB_STEP_SUMMARY"
