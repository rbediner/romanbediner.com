name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify handoff sync policy
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            node scripts/qa/verify-handoff-sync.js --allow-empty
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            node scripts/qa/verify-handoff-sync.js \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/qa/verify-handoff-sync.js \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}"
          else
            node scripts/qa/verify-handoff-sync.js --allow-empty
          fi

  session-ready:
    runs-on: ubuntu-latest
    needs: handoff-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Session readiness gate
        run: npm run session:ready

  gate-profile:
    runs-on: ubuntu-latest
    needs: session-ready
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      reason: ${{ steps.profile.outputs.reason }}
      route_scopes: ${{ steps.profile.outputs.route_scopes }}
      run_unit_tests: ${{ steps.profile.outputs.run_unit_tests }}
      run_regression_tests: ${{ steps.profile.outputs.run_regression_tests }}
      unit_command: ${{ steps.profile.outputs.unit_command }}
      regression_command: ${{ steps.profile.outputs.regression_command }}
      run_link_validation: ${{ steps.profile.outputs.run_link_validation }}
      run_browser_tests: ${{ steps.profile.outputs.run_browser_tests }}
      browser_command: ${{ steps.profile.outputs.browser_command }}
      run_qa_tests: ${{ steps.profile.outputs.run_qa_tests }}
      run_lighthouse_validation: ${{ steps.profile.outputs.run_lighthouse_validation }}
      run_build_artifact: ${{ steps.profile.outputs.run_build_artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve CI gate profile
        id: profile
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            node scripts/qa/resolve-gate-profile.js --format github-output >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            node scripts/qa/resolve-gate-profile.js \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --format github-output >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/qa/resolve-gate-profile.js \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}" \
              --format github-output >> "$GITHUB_OUTPUT"
          else
            node scripts/qa/resolve-gate-profile.js --format github-output >> "$GITHUB_OUTPUT"
          fi

      - name: Publish gate profile summary
        run: |
          {
            echo "## CI Gate Profile"
            echo ""
            echo "- Profile: ${{ steps.profile.outputs.profile }}"
            echo "- Reason: ${{ steps.profile.outputs.reason }}"
            echo "- Route scopes: ${{ steps.profile.outputs.route_scopes || 'none' }}"
            echo "- Unit tests: ${{ steps.profile.outputs.run_unit_tests }}"
            echo "- Regression tests: ${{ steps.profile.outputs.run_regression_tests }}"
            echo "- Unit command: ${{ steps.profile.outputs.unit_command || 'none' }}"
            echo "- Regression command: ${{ steps.profile.outputs.regression_command || 'none' }}"
            echo "- Link validation: ${{ steps.profile.outputs.run_link_validation }}"
            echo "- Browser tests: ${{ steps.profile.outputs.run_browser_tests }}"
            echo "- Browser command: ${{ steps.profile.outputs.browser_command || 'none' }}"
            echo "- QA tests: ${{ steps.profile.outputs.run_qa_tests }}"
            echo "- Lighthouse: ${{ steps.profile.outputs.run_lighthouse_validation }}"
            echo "- Build artifact: ${{ steps.profile.outputs.run_build_artifact }}"
          } >> "$GITHUB_STEP_SUMMARY"

  repo-contract:
    runs-on: ubuntu-latest
    needs:
      - session-ready
      - gate-profile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify repository contract
        run: npm run verify:repo-contract

  workflow-integrity:
    runs-on: ubuntu-latest
    needs:
      - session-ready
      - gate-profile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify workflow integrity
        run: npm run verify:workflow-integrity

  unit-tests:
    if: needs.gate-profile.outputs.run_unit_tests == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Run node architecture tests
        run: ${{ needs.gate-profile.outputs.unit_command }}

  qa-tests:
    if: needs.gate-profile.outputs.run_qa_tests == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright for Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.58.0 pillow==11.3.0
          python -m playwright install --with-deps chromium

      - name: Run python QA tests
        # Intentionally left without unittest parallel mode because this suite starts
        # local web servers and browser sessions that become flaky with process fan-out.
        run: npm run test:python

  regression-tests:
    if: needs.gate-profile.outputs.run_regression_tests == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Jest policy suite with safe worker default
        run: ${{ needs.gate-profile.outputs.regression_command }}

  browser-tests:
    if: needs.gate-profile.outputs.run_browser_tests == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright runtime suite
        run: ${{ needs.gate-profile.outputs.browser_command }}

  lighthouse-validation:
    if: needs.gate-profile.outputs.run_lighthouse_validation == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/rb-lighthouse-server.log 2>&1 &
          echo $! > /tmp/rb-lighthouse-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Run Lighthouse quality gate
        env:
          LIGHTHOUSE_ATTEMPTS: '3'
          LIGHTHOUSE_RETRY_DELAY_MS: '5000'
          LIGHTHOUSE_TARGET_WAIT_TIMEOUT_MS: '30000'
        run: node scripts/qa/run-lighthouse-check.js

      - name: Stop local static server
        if: always()
        run: |
          if [ -f /tmp/rb-lighthouse-server.pid ]; then
            kill "$(cat /tmp/rb-lighthouse-server.pid)" || true
          fi

  link-validation:
    if: needs.gate-profile.outputs.run_link_validation == 'true'
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/rb-link-server.log 2>&1 &
          echo $! > /tmp/rb-link-server.pid
          sleep 2

      - name: Run internal link validation
        run: node scripts/qa/run-link-check.js

      - name: Stop local static server
        if: always()
        run: |
          if [ -f /tmp/rb-link-server.pid ]; then
            kill "$(cat /tmp/rb-link-server.pid)" || true
          fi

  build-artifact:
    if: |
      always() &&
      needs.gate-profile.outputs.run_build_artifact == 'true' &&
      needs.repo-contract.result == 'success' &&
      needs.workflow-integrity.result == 'success' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.qa-tests.result == 'success' || needs.qa-tests.result == 'skipped') &&
      (needs.regression-tests.result == 'success' || needs.regression-tests.result == 'skipped') &&
      (needs.browser-tests.result == 'success' || needs.browser-tests.result == 'skipped') &&
      (needs.lighthouse-validation.result == 'success' || needs.lighthouse-validation.result == 'skipped') &&
      (needs.link-validation.result == 'success' || needs.link-validation.result == 'skipped')
    runs-on: ubuntu-latest
    needs:
      - gate-profile
      - repo-contract
      - workflow-integrity
      - unit-tests
      - qa-tests
      - regression-tests
      - browser-tests
      - lighthouse-validation
      - link-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Build static artifact
        run: node scripts/build/create-artifact.js --out /tmp/rb-site-artifact

      - name: Verify artifact integrity
        run: node scripts/qa/verify-artifact-integrity.js --artifact /tmp/rb-site-artifact --expect-commit ${{ github.sha }}

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: site-artifact-${{ github.sha }}
          path: /tmp/rb-site-artifact
          if-no-files-found: error
