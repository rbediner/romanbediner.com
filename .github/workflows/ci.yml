name: CI

on:
  push:
  pull_request:

jobs:
  # Node-based architecture and contract checks.
  qa-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node QA contract suite
        run: npm run test:node

  # Python unittest suite covering structure and browser-backed QA contracts.
  qa-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright for Python
        run: |
          python -m pip install --upgrade pip
          # Keep Python tooling aligned with repository QA expectations.
          pip install playwright==1.58.0 pillow==11.3.0
          python -m playwright install --with-deps chromium

      - name: Run Python QA suite
        run: npm run test:python

  # Jest policy tests (README integrity, comment headers, architecture schema checks).
  qa-jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Jest policy suite
        run: npm run test:jest

  # Node Playwright runtime checks; workers pinned for deterministic CI load.
  qa-playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright runtime suite (deterministic worker count)
        run: npm run test:playwright -- --workers=2

  # Final release gate: all parallel QA jobs must pass before branch protection can allow promotion.
  deploy-gate:
    runs-on: ubuntu-latest
    needs:
      - qa-node
      - qa-python
      - qa-jest
      - qa-playwright
    steps:
      - name: Confirm CI release gate
        run: echo "All QA jobs passed. Deploy gate is green."
