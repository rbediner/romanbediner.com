name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers for Node tests
        run: npx playwright install chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright for Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.58.2 pillow==11.3.0
          python -m playwright install --with-deps chromium

      - name: Run architecture and QA test suite
        run: npm run test:qa-full

      - name: Run Playwright browser regression suite
        run: npm run test:playwright
