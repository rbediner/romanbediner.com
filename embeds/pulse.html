<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse: Maya’s agency, alive </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Maya's Mission Control look (services/maya-chat/cc/static/sg-tokens.css). The app renders this same look in light and dark, so this page does too. */
:root{
  color-scheme:dark;
  --bg:#060a16; --surface:#0b1329; --surface2:#121c3f; --elevated:#182459; --border:#26335f; --border2:#7084b3; --lit:rgba(146,188,255,.34);
  --text:#f4f0ec; --muted:#b4c0d0; --accent:#5b9bff; --link:#92bcff; --pulse:#7ad0ff; --gold:#d9bd8f; --accentsoft:#1b2a63;
  --ok:#4ddc9c; --warn:#f2b55a; --bad:#ff8f84; --oksoft:#0b2b27; --badsoft:#34151b; --warnsoft:#2b2110;
  --claude:#c3a6ff; --codex:#62d6ea; --gemini:#d9bd8f; --maya:#f4f0ec; --fixer:#ff8f84;
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#060a16; --surface:#0b1329; --text:#f4f0ec; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#060a16; --surface:#0b1329; --text:#f4f0ec; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -10%,rgba(91,155,255,.10),transparent 70%);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pulse);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto auto minmax(0,1fr);height:100%}
header{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
h1{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 13px;min-height:40px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accentsoft);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.ctl{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.ctl select,.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--text)}
.spacer{margin-left:auto}
.noside{grid-template-columns:minmax(0,1fr) !important}
.noside aside{display:none}
#showSide{display:none;position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:20;background:var(--accent);color:#060a16;border:0;border-radius:8px 0 0 8px;padding:14px 10px;min-height:44px;cursor:pointer;font-weight:700;font-size:.84rem;writing-mode:vertical-rl}
.noside #showSide{display:block}
.who .hidebtn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;font-weight:600;font-size:.78rem;color:var(--muted)}
.who .hidebtn:hover{color:var(--text);border-color:var(--border2)}
#attn{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 20px;border-bottom:1px solid var(--border);font-size:.8rem;min-height:44px;background:var(--surface)}
#attn .ok,#attn .lbl{display:inline-flex;align-items:center;gap:8px;font-weight:600;margin-right:6px}
#attn .ok{color:var(--muted)} #attn .lbl{color:var(--text)}
#attn .ok::before,#attn .lbl::before,#attn button::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
#attn .ok::before{background:var(--ok)} #attn .lbl::before{background:var(--bad);box-shadow:0 0 0 4px rgba(255,143,132,.18)}
#attn button{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,143,132,.5);color:var(--text);border-radius:999px;padding:5px 12px 5px 10px;min-height:32px;cursor:pointer;font-size:.8rem;font-weight:500}
#attn button::before{background:var(--bad)}
#attn button.w{border-color:rgba(242,181,90,.5)} #attn button.w::before{background:var(--warn)}
#attn button:hover{background:var(--surface2)}
.prob{border:1px solid var(--bad);background:var(--badsoft);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.prob.w{border-color:var(--warn);background:var(--warnsoft)}
.prob strong{display:block;font-size:.9rem}
.node.hbad .box{stroke:var(--bad) !important;stroke-width:2.8 !important;animation:alarm 1.1s ease-in-out infinite}
.node.hwarn .box{stroke:var(--warn) !important;stroke-width:2.4 !important}
.hbad .cdt{fill:var(--bad)}
@keyframes alarm{50%{stroke-opacity:.3}}
.qbad{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem}
.note{grid-column:1 / -1;padding:5px 20px;font-size:.74rem;color:var(--muted);border-bottom:1px solid var(--border)}
.note strong{color:var(--gold);font-weight:600}
.boardwrap{overflow:auto;padding:6px 8px 16px;min-width:0}
svg#board{display:block;width:100%;min-width:1240px;height:auto}
aside{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:0}
.who{padding:8px 12px 8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.78rem;font-weight:700;color:var(--muted)}
#side{padding:16px 16px 24px;overflow-y:scroll;min-height:0;flex:1;scrollbar-color:var(--border2) var(--surface);scrollbar-width:thin}
#side::-webkit-scrollbar{width:10px} #side::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px} #side::-webkit-scrollbar-track{background:var(--surface)}
#side h2{font-family:var(--font-display);font-weight:400;font-size:1.3rem;line-height:1.2;margin:0 0 2px}
.kind{color:var(--gold);font-size:.78rem;font-weight:600;margin:0 0 10px}
.hint{color:var(--muted);font-size:.8rem !important;margin:0 0 6px !important}
#side h3{font-size:.76rem;font-weight:700;color:var(--muted);margin:16px 0 4px}
#side p{margin:0 0 6px;font-size:.9rem}
#side ul{margin:0;padding-left:18px;font-size:.88rem}
#side code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.76rem;word-break:break-all;color:var(--link)}
.ctx{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0}
.ask button,.signin{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px;margin:6px 0;cursor:pointer;font-size:.88rem;color:var(--text)}
.ask button:hover,.signin:hover{border-color:var(--accent)}
.signin{background:var(--accent);color:#060a16;font-weight:700;text-align:center;border-color:var(--accent)}
.sent{font-size:.82rem;color:var(--muted);margin-top:6px}
.shot{margin:8px 0 10px;border:1px solid var(--lit);border-radius:8px;background:linear-gradient(160deg,var(--elevated),var(--surface2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.8rem;text-align:center;padding:12px;width:100%}
.shot.tall{aspect-ratio:9 / 16;max-width:200px;margin-left:auto;margin-right:auto}
.shot.still{aspect-ratio:4 / 5;max-width:260px;margin-left:auto;margin-right:auto}
.shot svg{width:34px;height:34px}
.shot strong{color:var(--text);font-size:.86rem}
.facts{list-style:none;padding:0 !important;margin:0 0 6px}
.facts li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:6px 0;font-size:.84rem}
.facts li span:first-child{color:var(--muted)}
.openbtn{display:block;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px;margin:6px 0;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--text)}
.openbtn:hover{border-color:var(--accent)}
.fb textarea{display:block;width:100%;min-height:76px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-size:.86rem;resize:vertical;margin:6px 0}
.fb textarea:focus-visible{outline:2px solid var(--pulse);outline-offset:1px}
.fb .rowb{display:flex;gap:8px}
.fb .rowb button{flex:1;margin:0}
.fb .go{background:var(--accent);color:#060a16;border-color:var(--accent);font-weight:700;text-align:center}
.skill{border-left:2px solid var(--border2);padding:0 0 0 10px;margin:0 0 8px}
.skill p{font-size:.84rem !important;color:var(--muted)}
.back{background:transparent;border:0;padding:0 0 10px;cursor:pointer;color:var(--link);font-weight:600;font-size:.85rem;min-height:32px}
.log{list-style:none;padding:0 !important;margin:0}
.log li{border-bottom:1px solid var(--border)}
.log button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 0;cursor:pointer;font-size:.86rem;min-height:44px;color:var(--text)}
.log button:hover{color:var(--link)}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.74rem;display:block}
.legend{margin:6px 0 0;padding:0 !important;list-style:none;font-size:.8rem;color:var(--muted)}
.legend li{margin:0 0 6px;display:flex;gap:8px;align-items:center}
.legend svg{flex:none;width:22px;height:22px}
.legend strong{color:var(--text);font-weight:600}
/* board */
.t{fill:var(--text);font-family:var(--font-body)}
.m{fill:var(--muted);font-family:var(--font-body)}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.band{fill:var(--gold);font-family:var(--font-body);font-size:13px;font-weight:700}
.node{cursor:pointer}
.node:focus-visible{outline:none}
.box{fill:var(--surface);stroke:var(--border);stroke-width:1.2}
.node:hover .box{stroke:var(--lit)}
.node:focus-visible .box{stroke:var(--pulse);stroke-width:2.4}
.sel .box{stroke:var(--accent);stroke-width:2.4}
.node:hover .band{fill:var(--text)}
.ic{fill:none;stroke:var(--text);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icm{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wire{fill:none;stroke:var(--border);stroke-width:1.2}
.link{fill:none;stroke-width:2;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
.busflow{fill:none;stroke:var(--pulse);stroke-width:2;stroke-dasharray:3 14;opacity:.55;animation:flow2 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes flow2{to{stroke-dashoffset:-34}}
.breath{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:breath 3.2s ease-out infinite}
@keyframes breath{0%{transform:scale(.78);opacity:.55}100%{transform:scale(1.25);opacity:0}}
.hb{animation:hb 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hb{0%,100%{opacity:.35;transform:scale(.8)}35%{opacity:1;transform:scale(1.15)}}
.ringtrack{fill:none;stroke:var(--border);stroke-width:3}
.ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
.row .bar{fill:var(--accent)}
.row.fire .box{fill:var(--accentsoft);stroke:var(--accent)}
.chip{cursor:pointer;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.chip rect{fill:var(--surface2);stroke:var(--border2);stroke-width:1.2}
.chip:hover rect,.chip:focus-visible rect{stroke:var(--pulse);stroke-width:2}
.chip:focus-visible{outline:none}
.chip.bad rect{stroke:var(--bad);stroke-width:2.2;fill:var(--badsoft)}
.chip.live rect{stroke:var(--ok);fill:var(--oksoft)}
.chip.selp rect{stroke:var(--accent);stroke-width:2.6}
.gate .box{fill:var(--surface2)}
.gate.pass .box{stroke:var(--ok);fill:var(--oksoft);stroke-width:2.4}
.gate.refuse .box{stroke:var(--bad);fill:var(--badsoft);stroke-width:2.4}
.glow .box{stroke:var(--gold);stroke-width:2.4}
.out .box{stroke-dasharray:4 4}
.out .hb{animation:none;opacity:.5}
.locked .box{stroke:var(--warn);stroke-width:2.2;fill:var(--warnsoft)}
.beat{animation:beat .9s ease-out}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.08)}100%{transform:scale(1)}}
#mayaHex{transform-box:fill-box;transform-origin:center}
.pkt{cursor:pointer}
.paused .link,.paused .busflow,.paused .breath,.paused .hb,.paused .qbad,.paused .hbad .box{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){ .link,.busflow,.breath,.hb,.beat,.qbad,.node.hbad .box{animation:none} .chip{transition:none} }
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--border)} #side{max-height:70vh}
  .spacer{margin-left:0}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div>
    <h1>Pulse</h1>
    <p class="sub">An interactive illustration of the creative agency workflow</p>
  </div>
  <div class="seg spacer" role="group" aria-label="Scenario" id="modes">
    <button type="button" data-mode="wed" aria-pressed="true">Wednesday launch</button>
    <button type="button" data-mode="idle" aria-pressed="false">Idle day</button>
    <button type="button" data-mode="night" aria-pressed="false">Overnight</button>
  </div>
  <label class="ctl">Posts this week
    <select id="slots"><option>12</option><option selected>17</option><option>21</option><option>28</option></select>
  </label>
  <button type="button" class="btn" id="pause" aria-pressed="false">Pause</button>
  <button type="button" class="btn" id="hide" aria-pressed="false">Hide activity</button>
  <div class="clock" id="clock"></div>
</header>
<div class="note"><strong>Explore the agency workflow.</strong> Choose a scenario, adjust the weekly workload and select a part to see its role. This interactive illustration uses sample posts and messages, not live business activity.</div>
<div id="attn"></div>
<div class="boardwrap" tabindex="0" role="region" aria-label="Agency workflow. Scroll horizontally to explore the full diagram."><svg id="board" viewBox="0 0 1600 1210" role="group" aria-label="Pulse board"></svg></div>
<aside>
  <div class="who"><span id="panelLabel">Activity</span><button type="button" class="hidebtn" id="hide2">Hide panel</button></div>
  <div id="side" tabindex="0"></div>
</aside>
<button type="button" id="showSide">Show activity</button>
</div>
<script src="pulse.js"></script>
</body>
</html>
