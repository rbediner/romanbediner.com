<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | Home</title>
  <!-- Keep favicon consistent even on redirect alias route. -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
  <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
  <!-- /home is an alias path. Keep search indexing on the canonical homepage URL. -->
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://romanbediner.com/" />
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body>
  <p>Redirecting to <a href="/">homepage</a>...</p>
  <script>
    // JS redirect is a fallback for clients that ignore meta refresh.
    window.location.replace("/");
  </script>
</body>
</html>
