<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | Home</title>
  <!-- /home is an alias path. Keep search indexing on the canonical homepage URL. -->
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://rbediner.github.io/romanbediner.com/index.html" />
  <meta http-equiv="refresh" content="0; url=/index.html" />
</head>
<body>
  <p>Redirecting to <a href="/index.html">homepage</a>...</p>
  <script>
    // JS redirect is a fallback for clients that ignore meta refresh.
    window.location.replace("/index.html");
  </script>
</body>
</html>
