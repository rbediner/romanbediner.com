<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Roman Bediner" />
  <meta property="og:description" content="Operations as a Product (OaP)" />
  <meta property="og:image" content="https://rbediner.github.io/romanbediner.com/assets/og-logo/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="description" content="Operations as a Product (OaP)" />

  <title>Roman Bediner | Contact</title>
  <link rel="icon" type="image/png" href="../assets/logo/favicon.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Roman Bediner" />
  <meta name="twitter:description" content="Operations as a Product (OaP)" />
  <meta name="twitter:image" content="https://rbediner.github.io/romanbediner.com/assets/og-logo/og.png" />

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --muted-text: #5f5f5f;
      --border-color: #e6e6e6;
      --surface-color: #ffffff;
      --link-color: #3b6cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-header {
      padding: 6px 0;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: nowrap;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      height: 64px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-color);
    }

    .site-nav {
      display: none;
      gap: 32px;
      font-size: 16px;
    }

    .site-nav a {
      color: var(--text-color);
    }

    .site-nav a:hover {
      color: var(--link-color);
    }

    .menu-toggle {
      display: inline-flex;
      background: none;
      border: none;
      padding: 6px 8px;
      font-size: 16px;
      color: var(--text-color);
      cursor: pointer;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle .menu-icon {
      width: 18px;
      height: 2px;
      background-color: var(--text-color);
      display: inline-block;
      position: relative;
    }

    .menu-toggle .menu-icon::before,
    .menu-toggle .menu-icon::after {
      content: "";
      position: absolute;
      left: 0;
      width: 18px;
      height: 2px;
      background-color: var(--text-color);
    }

    .menu-toggle .menu-icon::before {
      top: -6px;
    }

    .menu-toggle .menu-icon::after {
      top: 6px;
    }

    .mobile-nav {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      padding: 12px 24px 20px 24px;
      z-index: 20;
    }

    .mobile-nav a {
      padding: 12px 0;
      font-size: 16px;
      color: var(--text-color);
      text-decoration: none;
    }

    .mobile-nav.open {
      display: flex;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px 72px 20px;
    }

    .contact-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: left;
      margin: 0 auto 40px auto;
      max-width: 760px;
    }

    .contact-icon {
      width: 64px;
      height: 64px;
      display: block;
      margin: 0;
      flex-shrink: 0;
    }

    .contact-hero-text {
      max-width: 680px;
    }

    .contact-hero h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 40px);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .contact-hero p {
      margin: 14px 0 0 0;
      font-size: 19px;
      color: var(--muted-text);
      max-width: 680px;
    }

    .form-wrap {
      max-width: 720px;
      margin: 16px auto 0 auto;
    }

    .form-card {
      background: var(--surface-color);
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.05);
    }

    .field {
      margin-top: 20px;
    }

    .field:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-color);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      color: var(--text-color);
      background-color: #ffffff;
    }

    input:focus,
    .ql-container:focus-within,
    .ql-toolbar:focus-within {
      outline: none;
      border-color: #b7b7b7;
    }

    .ql-toolbar.ql-snow {
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background-color: #fcfcfc;
    }

    .ql-container.ql-snow {
      border: 1px solid var(--border-color);
      border-radius: 0 0 8px 8px;
      font-size: 16px;
      color: var(--text-color);
      font-family: inherit;
    }

    .ql-editor {
      line-height: 1.6;
    }

    .submit-btn {
      margin-top: 20px;
      background-color: #111111;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-width: 148px;
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-error {
      margin-top: 12px;
      font-size: 14px;
      color: #a42525;
      min-height: 21px;
    }

    .success-message {
      margin: 0;
      font-size: 18px;
      color: var(--muted-text);
    }

    .linkedin-band {
      margin-top: 80px;
      padding: 48px 0;
      background: rgba(0, 0, 0, 0.03);
    }

    .linkedin-inner {
      text-align: center;
    }

    .linkedin-inner a {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .linkedin-inner a:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }

    .linkedin-icon {
      width: 36px;
      height: 36px;
      display: block;
      object-fit: contain;
    }

    .footer {
      padding: 48px 24px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 14px;
      color: var(--muted-text);
    }

    @media (min-width: 768px) {
      .header-inner {
        padding: 0 48px;
      }

      .brand-logo {
        height: 84px;
      }

      .brand-name {
        font-size: 40px;
      }

      .site-nav {
        display: flex;
      }

      .menu-toggle {
        display: none;
      }

      .container {
        padding: 56px 24px 80px 24px;
      }

      .form-card {
        padding: 40px;
      }
    }

    @media (max-width: 767px) {
      .contact-hero {
        align-items: flex-start;
        gap: 14px;
      }

      .contact-icon {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

<body>
  <!-- Global header and primary navigation -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="../assets/logo/mainlogo-blue-white.jpg" alt="Logo" class="brand-logo" />
        <span class="brand-name">Roman Bediner</span>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav">
        <span class="menu-icon" aria-hidden="true"></span>
        <span>Menu</span>
      </button>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Contact page content -->
  <main class="container">
    <section class="contact-hero">
      <img src="../assets/icons/contact.png" alt="Contact" class="contact-icon" />
      <div class="contact-hero-text">
        <h1>Let's start a conversation.</h1>
        <p>
          Share what you're working on or just reach out to connect.
        </p>
      </div>
    </section>

    <section class="form-wrap" aria-label="Contact form">
      <div class="form-card" id="form-card">
        <form id="contact-form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required aria-required="true" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required aria-required="true" />
          </div>

          <div style="display:none;">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" autocomplete="off" />
          </div>

          <div class="field">
            <label for="message-editor">Message</label>
            <div id="message-editor" aria-required="true"></div>
          </div>

          <button class="submit-btn" id="submit-btn" type="submit">Send message</button>
          <p class="form-error" id="form-error" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <div class="linkedin-band">
      <div class="linkedin-inner">
        <a href="https://linkedin.com/in/romanbediner" target="_blank" rel="noopener">
          <img src="../assets/icons/LinkedIn.png" class="linkedin-icon" alt="LinkedIn" />
          <span>Connect with me on LinkedIn</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Shared footer -->
  <footer class="footer">
    &copy; Roman Bediner
  </footer>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <!-- Shared mobile navigation behavior -->
  <script src="../scripts/site-navigation.js"></script>
  <!-- Contact form behavior (Quill + EmailJS) -->
  <script src="../scripts/contact-form-emailjs.js"></script>
</body>
</html>
