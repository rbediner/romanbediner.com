<svg viewBox="0 0 720 250" role="img" aria-label="Deploy pipeline: a git push triggers the Vercel GitHub App, which builds on every push. The main branch deploys to Production where the cron schedule runs, with instant rollback. Any other branch deploys to a Preview where the schedule never runs." xmlns="http://www.w3.org/2000/svg" font-family="&#39;DM Sans&#39;, system-ui, -apple-system, sans-serif">
  <title>Deploy pipeline — Git to Vercel — premium</title>
  <defs>
    <filter id="soft" x="-40%" y="-50%" width="180%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#141308" flood-opacity="0.10"></feDropShadow></filter>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.6,0.6 L5.6,3 L0.6,5.4" fill="none" stroke="#b3b9c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="5.6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.6,0.6 L5.6,3 L0.6,5.4" fill="none" stroke="#cba35a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></marker>
  </defs>

  
  <g fill="none" stroke="#d6dae2" stroke-width="1.4" stroke-linecap="round">
    <path d="M180,133 C200,133 212,133 231,133" marker-end="url(#ah)"></path>
    <path d="M445,116 C466,101 470,82 483,73" marker-end="url(#ah)"></path>
    <path d="M445,150 C466,167 470,189 483,203" marker-end="url(#ah)"></path>
  </g>
  <path d="M560,40 C560,12 640,12 640,37" fill="none" stroke="#cba35a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 5" marker-end="url(#ahg)">
    
  </path>
  <text x="478" y="92" text-anchor="end" font-size="10.5" fill="#6b6a63">main branch</text>
  <text x="480" y="190" text-anchor="end" font-size="10.5" fill="#6b6a63">any other branch</text>
  <text x="600" y="11" text-anchor="middle" font-size="10.5" fill="#6b6a63">instant rollback</text>

  
  <g filter="url(#soft)"><rect x="20" y="104" width="160" height="58" rx="16" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
  <rect x="36" y="116" width="34" height="34" rx="10" fill="#eef2fe"></rect>
  <g fill="none" stroke="#3b6cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(41 121)"><circle cx="7" cy="6" r="2.4"></circle><circle cx="7" cy="18" r="2.4"></circle><circle cx="17" cy="9" r="2.4"></circle><path d="M7 8.4 V15.6 M7 12 C7 10.2 9 9.2 14.6 9"></path></g>
  <text x="84" y="129" font-size="13.5" font-weight="600" fill="#16213f">git push</text>
  <text x="84" y="146" font-size="11" fill="#6b6a63">code change</text>

  
  <g filter="url(#soft)"><rect x="231" y="96" width="214" height="74" rx="17" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
  <rect x="247" y="116" width="34" height="34" rx="10" fill="#eef2fe"></rect>
  <g fill="none" stroke="#3b6cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(252 121)"><path d="M12 3 L20 7.2 V16.8 L12 21 L4 16.8 V7.2 Z"></path><path d="M4 7.2 L12 11.4 L20 7.2 M12 11.4 V21"></path></g>
  <text x="299" y="128" font-size="13.5" font-weight="600" fill="#16213f">Vercel GitHub App</text>
  <text x="299" y="146" font-size="11" fill="#6b6a63">builds on every push</text>

  
  <g filter="url(#soft)"><rect x="485" y="40" width="215" height="62" rx="16" fill="#ffffff" stroke="#cfe2da" stroke-width="1.2"></rect></g>
  <rect x="501" y="54" width="34" height="34" rx="10" fill="#e7f1ed"></rect>
  <g fill="none" stroke="#2e6b5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(506 59)"><path d="M12 3 L19 6 V11 C19 16 15.8 19.4 12 21 C8.2 19.4 5 16 5 11 V6 Z"></path><path d="M9 11.5 L11.2 13.8 L15.5 9.2"></path></g>
  <text x="549" y="68" font-size="13.5" font-weight="600" fill="#173b33">Production</text>
  <text x="549" y="86" font-size="11" fill="#173b33">cron schedule runs here</text>

  
  <g filter="url(#soft)"><rect x="485" y="178" width="215" height="56" rx="16" fill="#ffffff" stroke="#ecdfc4" stroke-width="1.2"></rect></g>
  <rect x="501" y="189" width="34" height="34" rx="10" fill="#f7f0e2"></rect>
  <g fill="none" stroke="#9a6b1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(506 194)"><path d="M2.5 12 C5 7 9 5 12 5 C15 5 19 7 21.5 12 C19 17 15 19 12 19 C9 19 5 17 2.5 12 Z"></path><circle cx="12" cy="12" r="3"></circle></g>
  <text x="549" y="203" font-size="13.5" font-weight="600" fill="#4a3712">Preview</text>
  <text x="549" y="220" font-size="11" fill="#4a3712">schedule never runs</text>
</svg>