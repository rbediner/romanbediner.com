  <g filter="url(#soft)"><rect x="110" y="48" width="90" height="70" rx="14" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
  <circle cx="155" cy="70" r="11" fill="#eef2fe"></circle><text x="155" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#3b6cff">2</text>
  <text x="155" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#16213f">Authenticate</text>

  
  <g filter="url(#soft)"><rect x="212" y="48" width="90" height="70" rx="14" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
  <circle cx="257" cy="70" r="11" fill="#eef2fe"></circle><text x="257" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#3b6cff">3</text>
