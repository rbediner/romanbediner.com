  <text x="665" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#173b33">Write</text>
  <text x="665" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#173b33">heartbeat</text>
</svg>