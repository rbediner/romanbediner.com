<svg viewBox="0 0 720 186" role="img" aria-label="Scheduled run lifecycle: step 1 cron fires, 2 authenticate, 3 local-hour guard, 4 load skill from brain, 5 agent loop (cached), 6 act in workspace, 7 write heartbeat. On error, the agent loop still writes a heartbeat." xmlns="http://www.w3.org/2000/svg" font-family="&#39;DM Sans&#39;, system-ui, -apple-system, sans-serif">
