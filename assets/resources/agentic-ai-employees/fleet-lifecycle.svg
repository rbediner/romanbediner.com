    <path d="M608,83 C613,83 615,83 620,83" marker-end="url(#ah)"></path>
  </g>
  
  <path d="M461,118 C461,156 665,156 665,121" fill="none" stroke="#b3b9c4" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1 5" marker-end="url(#ah)">
    
  </path>
  <text x="563" y="170" text-anchor="middle" font-size="10.5" fill="#6b6a63">on error</text>

  
  <g filter="url(#soft)"><rect x="8" y="48" width="90" height="70" rx="14" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
  <circle cx="53" cy="70" r="11" fill="#eef2fe"></circle><text x="53" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#3b6cff">1</text>
  <text x="53" y="98" text-anchor="middle" font-size="11" font-weight="500" fill="#16213f">Cron</text>
