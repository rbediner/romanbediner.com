  <text x="257" y="111" text-anchor="middle" font-size="11" font-weight="500" fill="#16213f">guard</text>

  
  <g filter="url(#soft)"><rect x="314" y="48" width="90" height="70" rx="14" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.2"></rect></g>
