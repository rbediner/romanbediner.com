<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-label="A Company Brain supports eight AI employee roles: Project Manager, Chief of Staff, RevOps Engineer, AI Correspondent, Director, Continuous Improvement Engineer, Staff Engineer and Solution Architect. People set priorities and own decisions.">
<title>One Company Brain. Eight distinct responsibilities.</title>
<desc>Roman's operating example: shared company knowledge supports follow-through, organizational memory, revenue analysis, AI research, coordination, improvement, independent engineering review and solution design. This is an example of work members can learn about, not a standard membership deliverable.</desc>
<!-- Show the full eight-role example without implying that one agent approves its own work. -->
