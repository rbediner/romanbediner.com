<rect x="200" y="91" width="560" height="87" rx="10" fill="#fff" stroke="#a4bdd3"/>
<g text-anchor="middle"><text x="480" y="127" font-family="Georgia,serif" fill="#16222e" font-size="30">Company Brain</text><text x="480" y="157" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="19">Shared knowledge, decisions and business context</text></g>
<path d="M480 178V208" fill="none" stroke="#104275" stroke-width="1.6" marker-end="url(#arrow)"/>
