<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="A Company Brain supplies shared context to a Project Manager and Chief of Staff. People retain decision authority; reviewed learning returns to the brain.">
  <!-- Public operating model. No private records, infrastructure or member details. -->
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#eef1e6" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#104275" stroke-width="1.4"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fcfbf3"/>
  <rect x="10" y="10" width="940" height="500" fill="url(#grid)"/>
  <text x="48" y="52" font-family="Georgia,serif" font-size="29" fill="#16222e">Shared context. Distinct responsibilities.</text>
  <text x="48" y="80" font-family="Arial,sans-serif" font-size="13" fill="#5b6b7a">An operating view of the systems I help build.</text>
  <g fill="#fff" stroke="#104275" stroke-opacity=".5">
    <rect x="280" y="108" width="400" height="102" rx="8"/>
    <rect x="88" y="278" width="344" height="110" rx="8"/>
    <rect x="528" y="278" width="344" height="110" rx="8"/>
  </g>
  <g font-family="Georgia,serif" fill="#16222e" text-anchor="middle">
    <text x="480" y="150" font-size="30">Company Brain</text>
    <text x="260" y="321" font-size="27">Project Manager</text>
    <text x="700" y="321" font-size="27">Chief of Staff</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#5b6b7a" text-anchor="middle">
    <text x="480" y="179">Business context, decisions and working knowledge</text>
    <text x="260" y="348">Commitments, owners, blockers and follow-through</text>
    <text x="700" y="348">Organized knowledge, summaries and context</text>
  </g>
  <g fill="none" stroke="#104275" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M400 212V240H260V264"/>
    <path d="M560 212V240H700V264"/>
    <path d="M260 390V420"/>
    <path d="M700 390V420"/>
    <path d="M874 333H920V159H694" stroke-dasharray="5 5"/>
  </g>
  <rect x="160" y="432" width="640" height="46" rx="8" fill="#fff" stroke="#8a6f2c" stroke-opacity=".5"/>
  <text x="480" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#6c551f">People own priorities, decisions and commitments.</text>
  <text x="480" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#104275">Reviewed decisions and lessons enrich the Company Brain.</text>
</svg>
