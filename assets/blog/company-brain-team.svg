<g font-family="Georgia,serif" fill="#16222e" font-size="24" text-anchor="middle"><text x="144" y="270">Project Manager</text><text x="368" y="270">Chief of Staff</text><text x="592" y="270">RevOps Engineer</text><text x="816" y="270">AI Correspondent</text><text x="144" y="429">Director</text><text x="368" y="422">Improvement</text><text x="368" y="450">Engineer</text><text x="592" y="429">Staff Engineer</text><text x="816" y="429">Solution Architect</text></g>
