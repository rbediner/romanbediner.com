<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-label="Agentic Society connects owners and CEOs with builders and advisors. Business context comes into the community; practical learning returns to each owner's company, and relationships continue.">
<title>Build with people. Bring it back to your business.</title>
<desc>A community connects owners, CEOs, builders and AI advisors. Their shared work helps people develop Company Brains, AI employees and connected workflows for their own teams. Owners bring back experience from using them.</desc>
<!-- The community is an ongoing relationship around each business, not an automated decision pipeline. -->
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eef1e6" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#104275" stroke-width="1.5"/></marker></defs>
<rect width="960" height="650" fill="#fcfbf3"/><rect x="10" y="10" width="940" height="630" fill="url(#grid)"/>
<g font-family="Georgia,serif" fill="#16222e"><text x="42" y="57" font-size="34">Build with people.</text><text x="42" y="96" font-size="34">Bring it back to your business.</text></g>
<g font-family="Arial,sans-serif" fill="#104275" font-size="15" letter-spacing="2"><text x="42" y="143">THE AGENTIC SOCIETY COMMUNITY</text></g>
<rect x="42" y="166" width="876" height="190" rx="12" fill="#fff" stroke="#bacbdc"/>
<path d="M480 190V327" stroke="#dce3ea"/>
<g font-family="Georgia,serif" fill="#16222e" font-size="29"><text x="68" y="211">Owners &amp; CEOs</text><text x="510" y="211">Builders &amp; AI advisors</text></g>
<g font-family="Arial,sans-serif" fill="#5b6b7a" font-size="20"><text x="68" y="248">Business context and priorities</text><text x="68" y="279">Experience from leading a company</text><text x="510" y="248">Practical help and shared builds</text><text x="510" y="279">Different ways to solve a problem</text></g>
<path d="M295 315H665" fill="none" stroke="#104275" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M300 356V411" stroke="#104275" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M660 411V356" stroke="#104275" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<g font-family="Arial,sans-serif" fill="#104275" font-size="18"><text x="55" y="391">Put the learning to work</text><text x="683" y="391">Share what you learn</text></g>
<rect x="42" y="419" width="876" height="139" rx="12" fill="#fff" stroke="#b7a369"/>
<g font-family="Georgia,serif" fill="#16222e"><text x="68" y="462" font-size="29">Your team. Your customers. Your business.</text></g>
<g font-family="Arial,sans-serif" fill="#5b6b7a" font-size="21"><text x="68" y="501">Company Brain · AI employees · Connected workflows</text><text x="68" y="533">People decide what to build and how to use it.</text></g>
<g font-family="Georgia,serif" fill="#16222e"><text x="480" y="606" font-size="25" text-anchor="middle">The relationship continues after the first build.</text></g>
</svg>
