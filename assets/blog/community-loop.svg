<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Learning gets useful when it comes back to your business."><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#eef1e6" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#104275" stroke-width="1.4"/></marker></defs><rect width="960" height="440" fill="#fcfbf3"/><rect x="10" y="10" width="940" height="420" fill="url(#grid)"/><text x="48" y="65" font-family="Georgia,serif" font-size="29" fill="#16222e">Learning gets useful when it comes back to your business.</text><rect x="48" y="127" width="256" height="134" rx="8" fill="#fff" stroke="#104275" stroke-opacity=".5"/><rect x="48" y="127" width="256" height="4" rx="2" fill="#104275"/><text x="68" y="160" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#104275">YOUR BUSINESS</text><text x="68" y="199" font-family="Georgia,serif" font-size="24" fill="#16222e">Bring the problem</text><text x="68" y="231" font-family="Arial,sans-serif" font-size="12" fill="#5b6b7a">Context. Constraints. Goals.</text><path d="M314 194h26" fill="none" stroke="#104275" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="352" y="127" width="256" height="134" rx="8" fill="#fff" stroke="#104275" stroke-opacity=".5"/><rect x="352" y="127" width="256" height="4" rx="2" fill="#104275"/><text x="372" y="160" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#104275">THE COMMUNITY</text><text x="372" y="199" font-family="Georgia,serif" font-size="24" fill="#16222e">Build with people</text><text x="372" y="231" font-family="Arial,sans-serif" font-size="12" fill="#5b6b7a">Peers. Advisors. Shared work.</text><path d="M618 194h26" fill="none" stroke="#104275" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="656" y="127" width="256" height="134" rx="8" fill="#fff" stroke="#8a6f2c" stroke-opacity=".5"/><rect x="656" y="127" width="256" height="4" rx="2" fill="#8a6f2c"/><text x="676" y="160" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#8a6f2c">YOUR TEAM</text><text x="676" y="199" font-family="Georgia,serif" font-size="24" fill="#16222e">Put it to use</text><text x="676" y="231" font-family="Arial,sans-serif" font-size="12" fill="#5b6b7a">Try a small, useful change.</text><path d="M784 275v51Q784 337 772 337H188Q176 337 176 325v-48" fill="none" stroke="#104275" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="264" y="318" width="430" height="35" fill="#fcfbf3"/><text x="480" y="339" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#104275">Share what happened. Refine the next build.</text><text x="48" y="399" font-family="Arial,sans-serif" font-size="11" fill="#5b6b7a">People stay accountable for the business outcome.</text></svg>