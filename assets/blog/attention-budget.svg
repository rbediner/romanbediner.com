<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-label="Illustrative human attention budget for 40 accepted handoffs.">
<title>Count the human work after AI.</title>
<desc>Hypothetical example with the same forty accepted handoffs. Before AI: eight human hours. With AI: two hours forty minutes review, one hour corrections, forty minutes interruptions, forty minutes maintenance. Total five hours, leaving three hours of potential capacity. A separate planning assumption divides ninety available review minutes by three minutes per handoff to estimate thirty handoffs a week.</desc>
<!-- A common zero and 90 pixels per hour preserve the actual comparison. These are not observed results. -->
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eef1e6"/></pattern></defs>
<rect width="1080" height="760" fill="#fcfbf3"/><rect x="10" y="10" width="1060" height="740" fill="url(#grid)"/>
<text x="42" y="62" font-family="Georgia,serif" fill="#16222e" font-size="36">Count the human work after AI.</text>
<text x="42" y="98" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="19">Illustrative: the same 40 accepted handoffs</text>
<g font-family="Arial,sans-serif" fill="#5b6b7a" font-size="16" text-anchor="middle"><text x="240" y="145">0h</text><text x="420" y="145">2h</text><text x="600" y="145">4h</text><text x="780" y="145">6h</text><text x="960" y="145">8h</text></g>
<g stroke="#dce3ea" fill="none"><path d="M240 155V380M420 155V380M600 155V380M780 155V380M960 155V380"/></g>
<text x="42" y="211" font-family="Georgia,serif" fill="#16222e" font-size="29">Before AI</text>
<g data-time-row="before" data-hours="8"><rect x="240" y="170" width="720" height="72" rx="8" fill="#104275"/><text x="600" y="214" font-family="Arial,sans-serif" fill="#fff" font-size="23" text-anchor="middle">Prepare and check: 8h</text></g>
<text x="42" y="341" font-family="Georgia,serif" fill="#16222e" font-size="29">With AI</text>
<g data-time-row="after" data-hours="5">
<rect class="attention-segment" data-minutes="160" x="240" y="300" width="240" height="72" fill="#104275"/><rect class="attention-segment" data-minutes="60" x="480" y="300" width="90" height="72" fill="#ab1d37"/><rect class="attention-segment" data-minutes="40" x="570" y="300" width="60" height="72" fill="#b7a369"/><rect class="attention-segment" data-minutes="40" x="630" y="300" width="60" height="72" fill="#5b6b7a"/>
<g font-family="Arial,sans-serif" fill="#fff" font-size="18" text-anchor="middle"><text x="360" y="343">2h 40m</text><text x="525" y="343">1h</text><text x="600" y="343">40m</text><text x="660" y="343">40m</text></g></g>
<g data-time-row="potential" data-hours="3"><rect x="690" y="300" width="270" height="72" rx="8" fill="#fff" stroke="#b7a369" stroke-width="1.5" stroke-dasharray="6 5"/><text x="825" y="343" font-family="Georgia,serif" fill="#806522" font-size="29" text-anchor="middle">3h potential</text></g>
<text x="825" y="408" font-family="Arial,sans-serif" fill="#806522" font-size="17" text-anchor="middle">Potential capacity for the business</text>
<!-- A labeled legend keeps category meaning available beyond segment color alone. -->
<g data-diagram-panel="review"><rect x="42" y="449" width="222" height="90" rx="8" fill="#fff" stroke="#a4bdd3"/><text x="62" y="485" font-family="Georgia,serif" fill="#104275" font-size="25">Review</text><text x="62" y="520" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">2 hours 40 minutes</text></g>
<g data-diagram-panel="corrections"><rect x="300" y="449" width="222" height="90" rx="8" fill="#fff" stroke="#e3bfc6"/><text x="320" y="485" font-family="Georgia,serif" fill="#ab1d37" font-size="25">Corrections</text><text x="320" y="520" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">1 hour</text></g>
<g data-diagram-panel="interruptions"><rect x="558" y="449" width="222" height="90" rx="8" fill="#fff" stroke="#b7a369"/><text x="578" y="485" font-family="Georgia,serif" fill="#806522" font-size="25">Interruptions</text><text x="578" y="520" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">40 minutes</text></g>
<g data-diagram-panel="maintenance"><rect x="816" y="449" width="222" height="90" rx="8" fill="#fff" stroke="#bacbdc"/><text x="836" y="485" font-family="Georgia,serif" fill="#16222e" font-size="25">Maintenance</text><text x="836" y="520" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">40 minutes</text></g>
<g data-diagram-panel="planning"><rect x="42" y="565" width="996" height="120" rx="10" fill="#fff" stroke="#b7a369"/><text x="66" y="602" font-family="Georgia,serif" fill="#16222e" font-size="28">Give review a capacity limit</text><text x="66" y="638" font-family="Arial,sans-serif" fill="#16222e" font-size="20">90 available minutes / 3 minutes per handoff = 30 handoffs per week</text><text x="66" y="668" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="16">Planning assumption. Reserve maintenance and difficult cases first.</text></g>
<text x="42" y="727" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">All 40 must meet the same standard. Count failed attempts and human fallback.</text>
</svg>
