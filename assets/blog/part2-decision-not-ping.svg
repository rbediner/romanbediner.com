<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1790" viewBox="0 0 640 1790" role="img" aria-labelledby="title desc" aria-label="A decision, not another ping."><title id="title">A decision, not another ping.</title><desc id="desc">Illustrative policy for one website article in one workspace. Hold the release while evidence is missing: the current owner remains responsible until a worker accepts the task. Queue the exact preview, source check and editorial review for a decision. Interrupt only if waiting risks a deadline or makes a serious problem worse; silence is not approval. After an approved release, compare the live page with the approved version. Log a receipt only if they match; mismatch is not success. Measure human attention per finished job, including attention spent on unfinished work.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0.5H24M0.5 0V24" fill="none" stroke="#dfe5d9" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="638" height="1788" rx="12" fill="#fcfbf3" stroke="#e4e0ce" stroke-width="2"/><rect x="8" y="8" width="624" height="1774" rx="8" fill="url(#grid)" stroke="white" stroke-width="6"/><text x="32" y="62" font-size="32" fill="#104275" font-weight="700">ONE WEBSITE WORKSPACE</text><text x="32" y="124" font-size="52" fill="#16222E" font-weight="700">A decision,</text><text x="32" y="184" font-size="52" fill="#16222E" font-weight="700">not another ping.</text><text x="32" y="234" font-size="32" fill="#16222E" font-weight="400">Example policy • not a run log</text><rect x="32" y="274" width="576" height="230" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="320" font-size="32" fill="#AB1D37" font-weight="700">HOLD / EVIDENCE MISSING</text><text x="54" y="370" font-size="34" fill="#16222E" font-weight="400">Refresh sources. Get review.</text><text x="54" y="418" font-size="34" fill="#16222E" font-weight="400">Owner stays until the next</text><text x="54" y="466" font-size="34" fill="#16222E" font-weight="400">worker accepts the task.</text><rect x="32" y="538" width="576" height="280" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="584" font-size="32" fill="#104275" font-weight="700">QUEUE / YOUR DECISION</text><text x="54" y="634" font-size="36" fill="#16222E" font-weight="700">Exact preview</text><text x="54" y="683" font-size="34" fill="#16222E" font-weight="400">+ source check</text><text x="54" y="732" font-size="34" fill="#16222E" font-weight="400">+ editorial review record</text><text x="54" y="785" font-size="34" fill="#AB1D37" font-weight="700">No approval? No release.</text><rect x="62" y="852" width="546" height="242" rx="16" fill="#fff9e8" stroke="#B7A369" stroke-width="2"/><text x="84" y="901" font-size="32" fill="#AB1D37" font-weight="700">INTERRUPT ONLY IF</text><text x="84" y="951" font-size="34" fill="#16222E" font-weight="400">Waiting risks harm or a deadline.</text><text x="84" y="1001" font-size="32" fill="#16222E" font-weight="400">Say what decision is needed.</text><text x="84" y="1051" font-size="34" fill="#16222E" font-weight="700">Silence is not approval.</text><path d="M32 858v228" stroke="#AB1D37" stroke-width="6"/><rect x="32" y="1128" width="576" height="280" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="1176" font-size="32" fill="#2E6B5E" font-weight="700">LOG / VERIFY THE RELEASE</text><text x="54" y="1226" font-size="33" fill="#16222E" font-weight="700">Live page = approved version?</text><text x="54" y="1275" font-size="34" fill="#16222E" font-weight="400">Match: receipt, no ping.</text><text x="54" y="1324" font-size="34" fill="#AB1D37" font-weight="400">Mismatch: not a success.</text><text x="54" y="1373" font-size="32" fill="#16222E" font-weight="400">Keep evidence in this workspace.</text><text x="32" y="1470" font-size="36" fill="#16222E" font-weight="700">Did you get your time back?</text><text x="32" y="1523" font-size="36" fill="#104275" font-weight="700">Human attention minutes</text><path d="M32 1547h576" stroke="#104275" stroke-width="2"/><text x="32" y="1593" font-size="34" fill="#104275" font-weight="700">Finished jobs at usual quality</text><text x="32" y="1659" font-size="32" fill="#16222E" font-weight="400">Count time on unfinished work.</text><text x="32" y="1707" font-size="32" fill="#16222E" font-weight="400">Track open jobs separately.</text></svg>