<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-label="A proposed loop for making business judgment reusable.">
<title>Let the next case use what you learned.</title>
<desc>Current standards support preparation and review. A named owner accepts work or returns it for correction. Decisions, reasons and exceptions are retained in the shared standards with their scope and owner. New circumstances require fresh judgment.</desc>
<!-- All three responsibilities sit inside the same shared-knowledge enclosure. Gold marks decision authority; red marks evidence review. -->
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eef1e6"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#104275" stroke-width="1.4"/></marker>
</defs>
<rect width="1080" height="810" fill="#fcfbf3"/><rect x="10" y="10" width="1060" height="790" fill="url(#grid)"/>
<text x="42" y="62" font-family="Georgia,serif" fill="#16222e" font-size="36">Let the next case use what you learned.</text>
<text x="42" y="100" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="19">A proposed operating loop for people and AI workflows</text>
<rect x="42" y="140" width="996" height="552" rx="12" fill="#fff" fill-opacity=".75" stroke="#a4bdd3"/>
<text x="68" y="181" font-family="Arial,sans-serif" fill="#104275" font-size="17" letter-spacing="1.4">SHARED CURRENT STANDARDS</text>
<text x="68" y="218" font-family="Georgia,serif" fill="#16222e" font-size="28">Approved examples, reasons, scope and decision owners</text>
<!-- The common bar supplies preparation, review and the owner; no one role is the sole consumer. -->
<g stroke="#104275" stroke-width="2" fill="none"><path d="M220 246H860"/><path d="M220 246V286" marker-end="url(#arrow)"/><path d="M540 246V286" marker-end="url(#arrow)"/><path d="M860 246V286" marker-end="url(#arrow)"/></g>
<g data-diagram-panel="prepare"><rect x="68" y="294" width="280" height="170" rx="9" fill="#fff" stroke="#104275"/>
<text x="92" y="336" font-family="Georgia,serif" fill="#104275" font-size="30">Prepare</text>
<text x="92" y="376" font-family="Arial,sans-serif" fill="#16222e" font-size="19">Use the current standard.</text>
<text x="92" y="410" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Flag missing information.</text>
<text x="92" y="444" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Keep sources attached.</text></g>
<g data-diagram-panel="review"><rect x="400" y="294" width="280" height="170" rx="9" fill="#fff" stroke="#ab1d37"/>
<text x="424" y="336" font-family="Georgia,serif" fill="#ab1d37" font-size="30">Review</text>
<text x="424" y="376" font-family="Arial,sans-serif" fill="#16222e" font-size="19">Check evidence and fit.</text>
<text x="424" y="410" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Explain the correction.</text>
<text x="424" y="444" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Surface exceptions.</text></g>
<g data-diagram-panel="decide"><rect x="732" y="294" width="280" height="170" rx="9" fill="#fff" stroke="#b7a369" stroke-width="2"/>
<text x="756" y="336" font-family="Georgia,serif" fill="#806522" font-size="30">Named owner</text>
<text x="756" y="376" font-family="Arial,sans-serif" fill="#16222e" font-size="19">Accept or return work.</text>
<text x="756" y="410" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Approve scoped changes.</text>
<text x="756" y="444" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Retain decision authority.</text></g>
<g fill="none" stroke="#104275" stroke-width="2" marker-end="url(#arrow)"><path d="M348 378H390"/><path d="M680 378H722"/></g>
<g data-diagram-panel="retain"><rect x="68" y="528" width="944" height="132" rx="9" fill="#fcfbf3" stroke="#b7a369"/>
<text x="92" y="566" font-family="Georgia,serif" fill="#16222e" font-size="28">Record the reason, then test a different case</text>
<text x="92" y="603" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="19">An exception stays an exception. A saved rule still needs proof of use.</text>
<text x="92" y="640" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="17">The owner updates shared standards only where the decision applies.</text></g>
<path d="M872 464V516" fill="none" stroke="#104275" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M68 587H54V202H60" fill="none" stroke="#104275" stroke-width="2" marker-end="url(#arrow)"/>
<text x="42" y="741" font-family="Georgia,serif" fill="#16222e" font-size="28">Changed circumstances require fresh judgment.</text>
<text x="42" y="779" font-family="Arial,sans-serif" fill="#5b6b7a" font-size="18">Keep the current decision visible to everyone doing, checking and accepting the work.</text>
</svg>
