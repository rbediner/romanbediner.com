<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc" aria-label="Same product. Different work."><title id="title">Same product. Different work.</title><desc id="desc">Roman’s setup: the same Claude Duet product in three accounts: personal, Client A and Client B. Choose the account allowed to access the work before choosing a topic. Test by finding an exact document. This depicts account choices, not verified security isolation. Dot brings work back to Roman; Codex handles the build work. He also keeps personal and rental-business Muse accounts. Different Grok Bot names do not establish separate client boundaries.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0.5H24M0.5 0V24" fill="none" stroke="#dfe5d9" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="638" height="1548" rx="12" fill="#fcfbf3" stroke="#e4e0ce" stroke-width="2"/><rect x="8" y="8" width="624" height="1534" rx="8" fill="url(#grid)" stroke="white" stroke-width="6"/><text x="32" y="62" font-size="32" fill="#104275" font-weight="700">CHOOSE THE ACCOUNT</text><text x="32" y="124" font-size="52" fill="#16222E" font-weight="700">Same product.</text><text x="32" y="184" font-size="52" fill="#16222E" font-weight="700">Different work.</text><rect x="32" y="222" width="576" height="132" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="269" font-size="32" fill="#104275" font-weight="700">01</text><text x="122" y="269" font-size="36" fill="#16222E" font-weight="700">Personal</text><rect x="122" y="287" width="238" height="49" rx="24" fill="#104275" stroke="#104275" stroke-width="2"/><text x="143" y="322" font-size="34" fill="#fff" font-weight="700">Claude Duet</text><rect x="32" y="376" width="576" height="132" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="423" font-size="32" fill="#104275" font-weight="700">02</text><text x="122" y="423" font-size="36" fill="#16222E" font-weight="700">Client A</text><rect x="122" y="441" width="238" height="49" rx="24" fill="#104275" stroke="#104275" stroke-width="2"/><text x="143" y="476" font-size="34" fill="#fff" font-weight="700">Claude Duet</text><rect x="32" y="530" width="576" height="132" rx="16" fill="#fff" stroke="#e4e0ce" stroke-width="2"/><text x="54" y="577" font-size="32" fill="#104275" font-weight="700">03</text><text x="122" y="577" font-size="36" fill="#16222E" font-weight="700">Client B</text><rect x="122" y="595" width="238" height="49" rx="24" fill="#104275" stroke="#104275" stroke-width="2"/><text x="143" y="630" font-size="34" fill="#fff" font-weight="700">Claude Duet</text><text x="32" y="718" font-size="36" fill="#104275" font-weight="700">First: whose work is this?</text><text x="32" y="765" font-size="34" fill="#16222E" font-weight="400">Then: find the exact document.</text><text x="32" y="812" font-size="34" fill="#16222E" font-weight="400">Right topic ≠ right account.</text><rect x="32" y="850" width="576" height="190" rx="16" fill="#fff9e8" stroke="#B7A369" stroke-width="2"/><text x="54" y="896" font-size="32" fill="#104275" font-weight="700">CHECK BEFORE YOU ACT</text><text x="54" y="941" font-size="34" fill="#16222E" font-weight="400">Which account can see it?</text><text x="54" y="988" font-size="34" fill="#16222E" font-weight="400">Which account may act?</text><text x="32" y="1101" font-size="36" fill="#16222E" font-weight="700">Different jobs in my setup</text><text x="32" y="1151" font-size="34" fill="#16222E" font-weight="400">Dot → work comes back to me</text><text x="32" y="1198" font-size="34" fill="#16222E" font-weight="400">Codex → the build work</text><text x="32" y="1245" font-size="34" fill="#16222E" font-weight="400">Muse → personal / rentals</text><text x="32" y="1292" font-size="34" fill="#16222E" font-weight="400">Grok → specialist assignments</text><text 