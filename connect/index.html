<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Primary SEO metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Connect with Roman Bediner | Executive Advisory & Operator Coaching" />
  <!-- Corrected metadata phrasing to enforce the authoritative sentence-case core phrase and standardized SEO wording. -->
  <meta property="og:description" content="Productizing operations for modern, AI-enabled work — Executive operator designing AI-enabled operating models that align product, engineering, and customer systems." />
  <!-- Corrected Open Graph URL to align with clean canonical Contact path requested for metadata normalization. -->
  <meta property="og:url" content="https://romanbediner.com/contact" />
  <meta property="og:image" content="https://romanbediner.com/assets/og-logo/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- Corrected metadata phrasing to normalize casing and align with the authoritative core phrase. -->
  <meta name="description" content="Productizing operations for modern, AI-enabled work — Executive operator designing AI-enabled operating models that align product, engineering, and customer systems." />
  <!-- Corrected canonical URL to clean Contact path without .html or trailing slash variant. -->
  <link rel="canonical" href="https://romanbediner.com/contact" />
  <meta name="geo.region" content="US-NC" />
  <meta name="geo.placename" content="Raleigh-Durham-Chapel Hill" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Connect with Roman Bediner | Executive Advisory & Operator Coaching" />
  <!-- Corrected metadata phrasing so Twitter description matches normalized Open Graph and meta description text. -->
  <meta name="twitter:description" content="Productizing operations for modern, AI-enabled work — Executive operator designing AI-enabled operating models that align product, engineering, and customer systems." />
  <meta name="twitter:image" content="https://romanbediner.com/assets/og-logo/og.png" />
  <title>Connect with Roman Bediner | Executive Advisory & Operator Coaching</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' https://cdn.jsdelivr.net https://cdn.quilljs.com https://www.emailjs.com; style-src 'self' 'unsafe-inline' https://cdn.quilljs.com; connect-src https://api.emailjs.com;">
  <link rel="icon" type="image/png" href="../assets/logo/favicon.png" />
  <link rel="preload" as="image" href="../assets/icons/mainlogo.svg">
  <link rel="preload" as="image" href="../assets/icons/contact.png">
  <!-- Google Analytics 4: Replace G-XXXXXXXXXX with production Measurement ID. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-XXXXXXXXXX");
  </script>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

  <style>
    html {
      scroll-behavior: smooth;
    }

    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --muted-text: #5f5f5f;
      --border-color: #e6e6e6;
      --surface-color: #ffffff;
      --link-color: #3b6cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .site-header {
      padding: 6px 0;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .site-header img {
      height: 44px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      height: 44px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-color);
    }

    .site-nav {
      display: none;
      gap: 32px;
      font-size: 16px;
    }

    .site-nav a {
      color: var(--text-color);
    }

    .site-nav a:hover {
      color: var(--link-color);
    }

    .menu-toggle {
      display: inline-flex;
      background: none;
      border: none;
      padding: 6px 8px;
      font-size: 16px;
      color: var(--text-color);
      cursor: pointer;
      align-items: center;
      gap: 8px;
    }

    .menu-toggle .menu-icon {
      width: 18px;
      height: 2px;
      background-color: var(--text-color);
      display: inline-block;
      position: relative;
    }

    .menu-toggle .menu-icon::before,
    .menu-toggle .menu-icon::after {
      content: "";
      position: absolute;
      left: 0;
      width: 18px;
      height: 2px;
      background-color: var(--text-color);
    }

    .menu-toggle .menu-icon::before {
      top: -6px;
    }

    .menu-toggle .menu-icon::after {
      top: 6px;
    }

    .mobile-nav {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      padding: 12px 24px 20px 24px;
      z-index: 20;
    }

    .mobile-nav a {
      padding: 12px 0;
      font-size: 16px;
      color: var(--text-color);
      text-decoration: none;
    }

    .mobile-nav.open {
      display: flex;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .page-main {
      padding: 72px 0;
    }

    .contact-shell {
      max-width: 720px;
      margin: 0 auto;
    }

    .contact-hero {
      margin: 0 0 40px 0;
      max-width: none;
    }

    .hero-title {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
    }

    .hero-title img {
      width: 52px;
      height: auto;
      flex-shrink: 0;
    }

    .contact-hero h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 40px);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .contact-hero p {
      margin: 14px 0 0 0;
      font-size: 19px;
      color: var(--muted-text);
      max-width: none;
      text-align: center;
    }

    .form-wrap {
      max-width: none;
      margin: 16px 0 0 0;
    }

    .field {
      margin-top: 20px;
    }

    .field:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-color);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      color: var(--text-color);
      background-color: #ffffff;
    }

    input:focus,
    .ql-container:focus-within,
    .ql-toolbar:focus-within {
      outline: none;
      border-color: #b7b7b7;
    }

    .ql-toolbar.ql-snow {
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background-color: #fcfcfc;
    }

    .ql-container.ql-snow {
      border: 1px solid var(--border-color);
      border-radius: 0 0 8px 8px;
      font-size: 16px;
      color: var(--text-color);
      font-family: inherit;
    }

    .ql-editor {
      line-height: 1.6;
    }

    .submit-btn {
      margin-top: 20px;
      background-color: #111111;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-width: 148px;
    }

    .form-error {
      margin-top: 12px;
      font-size: 14px;
      color: #a42525;
      min-height: 21px;
    }

    .success-message {
      margin: 0;
      font-size: 18px;
      color: var(--muted-text);
    }

    .linkedin-band {
      max-width: none;
      margin: 80px 0 0 0;
      padding: 48px 0;
      background: rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .linkedin-inner a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .linkedin-inner a:hover {
      transform: translateY(-2px);
      opacity: .85;
    }

    .linkedin-icon {
      width: 36px;
      height: 36px;
      display: block;
    }

    .section {
      margin: 72px 0;
    }

    .section h2,
    .section h3 {
      margin-bottom: 14px;
    }

    .section p {
      margin-bottom: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.06);
      padding: 28px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    }

    button,
    .btn {
      transition: all 0.2s ease;
    }

    button:hover,
    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    input:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(45,92,255,0.35);
      outline-offset: 2px;
    }

    .footer {
      padding: 48px 24px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 14px;
      color: var(--muted-text);
    }

    @media (min-width: 768px) {
      .header-inner {
        padding: 0;
      }

      .brand-logo {
        height: 44px;
      }

      .brand-name {
        font-size: 40px;
      }

      .site-nav {
        display: flex;
      }

      .menu-toggle {
        display: none;
      }

      .container {
        padding: 0 24px;
      }

      .form-card {
        padding: 40px;
      }
    }

    @media (max-width: 767px) {
      .container {
        padding: 0 24px;
      }

      .hero-title {
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="../assets/logo/mainlogo-blue-white.jpg" alt="Logo" class="brand-logo" />
        <span class="brand-name">Roman Bediner</span>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="../">Home</a>
        <a href="../about/">About</a>
        <a href="../services/">Services</a>
        <a href="../connect/">Connect</a>
      </nav>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav">
        <span class="menu-icon" aria-hidden="true"></span>
        <span>Menu</span>
      </button>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
        <a href="../">Home</a>
        <a href="../about/">About</a>
        <a href="../services/">Services</a>
        <a href="../connect/">Connect</a>
      </nav>
    </div>
  </header>

  <main class="container page-main">
    <div class="contact-shell">
      <section class="contact-hero section">
        <div class="hero-title">
          <img src="../assets/icons/contact.png" alt="Contact" />
          <h1>Let's start a conversation.</h1>
        </div>
        <p>
          Share what you're working on or just reach out to connect.
        </p>
      </section>

      <section class="form-wrap section" aria-label="Contact form">
        <div class="form-card card" id="form-card">
          <form id="contact-form">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required aria-required="true" />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required aria-required="true" />
            </div>

            <div style="display:none;">
              <label for="company">Company</label>
              <input id="company" name="company" type="text" autocomplete="off"/>
            </div>

            <div class="field">
              <label for="message-editor">Message</label>
              <div id="message-editor" aria-required="true"></div>
            </div>

            <button class="submit-btn" id="submit-btn" type="submit">Send message</button>
            <p class="form-error" id="form-error" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <div class="linkedin-band">
        <div class="linkedin-inner">
          <a href="https://linkedin.com/in/romanbediner" target="_blank" rel="noopener noreferrer">
            <img src="../assets/icons/LinkedIn.png" class="linkedin-icon" alt="LinkedIn"/>
            <span>Connect with me on LinkedIn</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    &copy; Roman Bediner
  </footer>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="../scripts/site-navigation.js"></script>
  <script src="../scripts/contact-form-emailjs.js"></script>
</body>
</html>
